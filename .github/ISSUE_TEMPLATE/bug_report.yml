name: Bug report
description: Report a reproducible problem in Jani.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include vulnerability details here. Use private security reporting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the commands, inputs, and smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Include relevant serial output, test failures, or backtraces.
      render: shell
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Which commit or branch did you test?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include host OS, Zig version, QEMU version, and relevant hardware details.
    validations:
      required: true
